services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      CLARITY_HISTORY_DB: /app/backend/data/history.db
      CLARITY_TRUST_PROXY: "true"
      CLARITY_JWT_SECRET: ${CLARITY_JWT_SECRET:?set a random CLARITY_JWT_SECRET in your .env}
      CLARITY_CORS_ORIGINS: ${CLARITY_CORS_ORIGINS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      HF_HOME: /home/mesh/.cache/huggingface
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
    volumes:
      - clarity_data:/app/backend/data
      - clarity_uploads:/app/backend/uploads
      - clarity_weights:/app/backend/weights
      - model_cache:/home/mesh/.cache/huggingface
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CLARITY_WEB_PORT:-8080}:80"

volumes:
  clarity_data:
  clarity_uploads:
  clarity_weights:
  model_cache:
